$kind: http-request
description: |-
  Lista el catálogo de destinos (terminales, ciudades y puntos de recogida). Devuelve un arreglo JSON con todos los registros.

  ## Endpoint

  `GET {{baseUrl}}/destinos`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  ## Permisos

  - **Administrador:** ve todos los registros.
  - Un **Conductor** puede consultar el catálogo completo, pero no modificarlo.

  ## Campos de la respuesta

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `id_destino` | integer | Identificador único (lo asigna la base de datos). |
  | `nombre_destino` | string | Nombre del lugar (mínimo 2 caracteres). |
  | `ciudad` | string | Ciudad (mínimo 2 caracteres). |
  | `departamento` | string | Departamento. |
  | `tiempo_estimado_viaje_horas` | number | Horas estimadas de viaje (mayor que 0, ej. `1.5`). |
  | `activo` | boolean | Si el destino está disponible. Por defecto `true`. |

  ## Ejemplo de respuesta

  ```json
  [
    {
      "id_destino": 1,
      "nombre_destino": "Terminal del Norte",
      "ciudad": "Medellín",
      "departamento": "Antioquia",
      "tiempo_estimado_viaje_horas": 8.5,
      "activo": true
    }
  ]
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Arreglo con los registros (vacío `[]` si no hay ninguno). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/destinos"
method: GET
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 2000
