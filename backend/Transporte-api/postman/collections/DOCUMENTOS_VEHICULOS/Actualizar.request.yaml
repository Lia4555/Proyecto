$kind: http-request
description: |-
  Actualiza el documento de vehículo indicado por su `id_documento`. Es una **actualización parcial**: solo se envían los campos que se quieren cambiar.

  ## Endpoint

  `PUT {{baseUrl}}/documentos-vehiculo/:id`

  Ejemplo: `PUT {{baseUrl}}/documentos-vehiculo/2`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Parámetros de ruta

  | Parámetro | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `id` | integer | Sí | `id_documento` del registro a actualizar. |

  ## Request Body

  Cualquiera de estos campos (todos opcionales), con las mismas reglas que al crear:

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `numero_documento` | string | Número del documento. **Único**. |
  | `tipo_documento_legal` | string | Nombre legal del documento (ej. "SOAT"). |
  | `fecha_expedicion` | string (date) | Formato `YYYY-MM-DD`. |
  | `fecha_vencimiento` | string (date) | Formato `YYYY-MM-DD`. |
  | `aseguradora` | string | Entidad que lo expide. |
  | `valor_asegurado` | number | Valor asegurado en pesos. |
  | `archivo_url` | string (URL) | Enlace al archivo digitalizado. |
  | `estado_vigente` | boolean | Si el documento está vigente. Por defecto `true`. |
  | `observaciones` | string | Notas adicionales. |
  | `id_vehiculo` | integer | ID del vehículo (ver **VEHÍCULO**). |
  | `id_tipo_documento` | integer | ID del tipo de documento (ver **TIPOS_DOCUMENTOS**). |

  ## Ejemplo de Request Body

  ```json
  {
    "aseguradora": "Seguros Bolívar",
    "estado_vigente": true,
    "observaciones": "Documento verificado."
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Registro actualizado. Devuelve `{ success, data }` con el registro completo. |
  | `400 Bad Request` | No se envió ningún campo válido, o algún dato no cumple el formato (ver `detalles`). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `404 Not Found` | No existe un documento de vehículo con ese `id`. |
  | `409 Conflict` | Ya existe otro registro con ese numero_documento. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/documentos-vehiculo/2"
method: PUT
body:
  type: json
  content: |-
    {
      "aseguradora": "Seguros Bolívar",
      "estado_vigente": true,
      "observaciones": "Documento verificado."
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 3000
