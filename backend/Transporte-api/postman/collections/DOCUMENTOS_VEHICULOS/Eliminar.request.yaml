$kind: http-request
description: |-
  Elimina el documento de vehículo indicado por su `id_documento` de forma permanente.

  ## Endpoint

  `DELETE {{baseUrl}}/documentos-vehiculo/:id`

  Ejemplo: `DELETE {{baseUrl}}/documentos-vehiculo/3`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Parámetros de ruta

  | Parámetro | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `id` | integer | Sí | `id_documento` del registro a eliminar. |

  No lleva body.

  ## Respuesta exitosa

  ```json
  {
    "success": true,
    "message": "Registro eliminado exitosamente"
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Eliminado. Ojo: también responde `200` si el `id` no existía. |
  | `400 Bad Request` | Otros registros dependen de este (llave foránea), así que no se puede borrar. |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `500 Internal Server Error` | Error interno del servidor. |

  ## Notas

  - Esta operación es **irreversible**.
  - Revisa el `id` de la URL antes de enviar: apunta a un registro real.
url: "{{baseUrl}}/documentos-vehiculo/3"
method: DELETE
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 4000
