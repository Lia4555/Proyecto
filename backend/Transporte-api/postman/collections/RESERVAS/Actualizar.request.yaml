$kind: http-request
description: |-
  Actualiza la reserva indicado por su `id_reserva`. Es una **actualización parcial**: solo se envían los campos que se quieren cambiar.

  ## Endpoint

  `PUT {{baseUrl}}/reservas/:id`

  Ejemplo: `PUT {{baseUrl}}/reservas/6`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Parámetros de ruta

  | Parámetro | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `id` | integer | Sí | `id_reserva` del registro a actualizar. |

  ## Request Body

  Cualquiera de estos campos (todos opcionales), con las mismas reglas que al crear:

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `numero_reserva` | string | Consecutivo `RES-0001`, `RES-0002`… Si no se envía, lo genera el servidor. **Único**. |
  | `asiento_asignado` | string | Asiento (máximo 10 caracteres, ej. `B12`). |
  | `clase_viaje` | integer | ID de la clase de viaje (ver **CLASE_VIAJE**). |
  | `precio_pagado` | number | Valor pagado en pesos (mayor que 0). |
  | `estado_reserva` | string | Ej. "Confirmada", "Por confirmar", "Cancelada". Por defecto `Confirmada`. |
  | `fecha_check_in` | string (date-time) | Fecha y hora ISO 8601 con zona, ej. `2026-10-25T06:00:00-05:00`. |
  | `id_servicio` | integer \| null | ID del servicio (ver **SERVICIOS**). Una reserva puede no tener servicio todavía. |
  | `id_cliente` | string (UUID) | ID del cliente (ver **CLIENTE**). |

  ## Ejemplo de Request Body

  ```json
  {
    "estado_reserva": "Por confirmar",
    "asiento_asignado": "C04"
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Registro actualizado. Devuelve `{ success, data }` con el registro completo. |
  | `400 Bad Request` | No se envió ningún campo válido, o algún dato no cumple el formato (ver `detalles`). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `404 Not Found` | No existe una reserva con ese `id`. |
  | `409 Conflict` | Ya existe otro registro con ese numero_reserva. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/reservas/6"
method: PUT
body:
  type: json
  content: |-
    {
      "estado_reserva": "Por confirmar",
      "asiento_asignado": "C04"
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 3000
