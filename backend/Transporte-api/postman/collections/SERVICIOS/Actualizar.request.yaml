$kind: http-request
description: |-
  Actualiza el servicio indicado por su `id_servicio`. Es una **actualización parcial**: solo se envían los campos que se quieren cambiar.

  ## Endpoint

  `PUT {{baseUrl}}/servicios/:id`

  Ejemplo: `PUT {{baseUrl}}/servicios/8`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Un **Conductor** solo ve los servicios que tiene asignados y solo puede cambiar `id_estado`, `fecha_llegada_real` y `observaciones`.

  ## Parámetros de ruta

  | Parámetro | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `id` | integer | Sí | `id_servicio` del registro a actualizar. |

  ## Request Body

  Cualquiera de estos campos (todos opcionales), con las mismas reglas que al crear:

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `codigo_servicio` | string | Consecutivo `SVC-0001`, `SVC-0002`… Si no se envía, lo genera el servidor. **Único**. |
  | `tipo_servicio` | string | Ej. "Regular", "Especial", "Intermunicipal". Por defecto `Regular`. |
  | `fecha_salida` | string (date-time) | ISO 8601 con zona, ej. `2026-10-20T06:00:00-05:00`. |
  | `fecha_llegada_estimada` | string (date-time) | ISO 8601 con zona. |
  | `fecha_llegada_real` | string (date-time) | Se llena al terminar el viaje. |
  | `numero_pasajeros` | integer | Mayor que 0. |
  | `precio_total` | number | Valor del servicio en pesos (mayor que 0). |
  | `distancia_estimada_km` | number | Distancia estimada en km. |
  | `peajes_estimados` | number | Valor estimado de peajes. Por defecto `0`. |
  | `observaciones` | string | Notas del servicio. |
  | `id_conductor` | string (UUID) | ID del conductor asignado (ver **CONDUCTORES**). |
  | `id_vehiculo` | integer | ID del vehículo asignado (ver **VEHÍCULO**). |
  | `origen` | string | Lugar de salida en texto libre (2 a 120 caracteres). |
  | `destino` | string | Lugar de llegada en texto libre (2 a 120 caracteres). Debe ser distinto del origen. |
  | `id_origen` | integer \| null | Alternativa a `origen`: ID de un destino del catálogo (ver **DESTINO**). |
  | `id_destino` | integer \| null | Alternativa a `destino`: ID de un destino del catálogo. |
  | `id_estado` | integer | ID del estado (ver **ESTADOS_SERVICIO**; ej. `2` = Programado). |

  ## Ejemplo de Request Body

  ```json
  {
    "id_estado": 4,
    "fecha_llegada_real": "2026-10-20T15:10:00-05:00",
    "observaciones": "Viaje finalizado sin novedades."
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Registro actualizado. Devuelve `{ success, data }` con el registro completo. |
  | `400 Bad Request` | No se envió ningún campo válido, o algún dato no cumple el formato (ver `detalles`). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `404 Not Found` | No existe un servicio con ese `id`. |
  | `409 Conflict` | Ya existe otro registro con ese codigo_servicio. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/servicios/8"
method: PUT
body:
  type: json
  content: |-
    {
      "id_estado": 4,
      "fecha_llegada_real": "2026-10-20T15:10:00-05:00",
      "observaciones": "Viaje finalizado sin novedades."
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 3000
