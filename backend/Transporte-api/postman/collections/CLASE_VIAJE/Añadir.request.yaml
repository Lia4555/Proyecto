$kind: http-request
description: |-
  Crea una nueva clase de viaje. Gestiona las clases de viaje (Económica, Estándar, Premium…) que se asignan a las reservas.

  ## Endpoint

  `POST {{baseUrl}}/clases-viaje`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Request Body

  | Campo | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `nombre_clase` | string | Sí | Nombre de la clase (mínimo 2 caracteres). **Único**: no se puede repetir. |
  | `descripcion` | string | No | Descripción breve de la clase. |
  | `multiplicador_precio` | number | No | Factor que se aplica al precio base. Por defecto `1.00`. |
  | `beneficios` | string | No | Beneficios incluidos en la clase. |

  Los campos que no estén en esta tabla se ignoran.

  ## Ejemplo de Request Body

  ```json
  {
    "nombre_clase": "Ejecutiva Plus",
    "descripcion": "Silla reclinable con apoya piernas",
    "multiplicador_precio": 1.8,
    "beneficios": "Wifi, snack y equipaje de bodega hasta 25 kg"
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `201 Created` | La clase de viaje se creó. Devuelve `{ success, message, data }` con el registro guardado. |
  | `400 Bad Request` | Faltan campos obligatorios o algún dato no cumple el formato. El campo `detalles` indica qué campo falló y por qué. |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `409 Conflict` | Ya existe un registro con ese nombre_clase. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/clases-viaje"
method: POST
body:
  type: json
  content: |-
    {
      "nombre_clase": "Ejecutiva Plus",
      "descripcion": "Silla reclinable con apoya piernas",
      "multiplicador_precio": 1.8,
      "beneficios": "Wifi, snack y equipaje de bodega hasta 25 kg"
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
examples: ./.resources/Añadir.resources/examples
order: 1000
