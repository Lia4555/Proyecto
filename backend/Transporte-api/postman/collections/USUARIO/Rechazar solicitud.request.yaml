$kind: http-request
description: |-
  Rechaza y elimina una solicitud de cuenta **pendiente** (creada con el registro público). Si el conductor no tiene historial, también se borra su ficha.

  ## Endpoint

  `DELETE {{baseUrl}}/cuentas/:id`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**. Además, en cada petición se comprueba que la cuenta siga activa: si un administrador la desactiva, el token deja de servir al momento (`401`).

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Parámetros de ruta

  Parámetro `id`: `id_usuario` (UUID) de la cuenta. Se toma de **Show All (listar cuentas)** y se pone en la variable `id_cuenta` del environment, o se pega directamente en la URL.

  No lleva body.

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Solicitud rechazada. El mensaje indica si la ficha del conductor se eliminó o se conservó. |
  | `400 Bad Request` | La cuenta está activa, ya había sido aprobada (está desactivada) o es de un administrador. Esas no se borran: se desactivan. |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `404 Not Found` | No existe una cuenta con ese `id`. |
  | `500 Internal Server Error` | Error interno del servidor. |

  ## Notas

  - Esta operación es **irreversible**.
url: "{{baseUrl}}/cuentas/{{id_cuenta}}"
method: DELETE
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 4000
