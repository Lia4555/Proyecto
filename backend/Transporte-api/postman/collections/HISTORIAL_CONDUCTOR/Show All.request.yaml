$kind: http-request
description: |-
  Lista el historial de asignaciones de conductores a vehículos. Devuelve un arreglo JSON con todos los registros.

  ## Endpoint

  `GET {{baseUrl}}/historial-conductores`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  ## Permisos

  - **Administrador:** ve todos los registros.
  - **Conductor:** no tiene acceso a esta tabla (`403`).

  ## Campos de la respuesta

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `id_historial` | integer | Identificador único (lo asigna la base de datos). |
  | `id_vehiculo` | integer | ID del vehículo (ver **VEHÍCULO**). |
  | `id_conductor` | string (UUID) | ID del conductor (ver **CONDUCTORES**). |
  | `fecha_asignacion` | string (date) | Formato `YYYY-MM-DD`. |
  | `fecha_desasignacion` | string (date) \| null | Formato `YYYY-MM-DD`; `null` si sigue asignado. |
  | `observaciones` | string | Notas de la entrega del vehículo. |

  ## Ejemplo de respuesta

  ```json
  [
    {
      "id_historial": 1,
      "id_vehiculo": 7,
      "id_conductor": "f38b2ffc-80a4-4f5a-91c9-bc701e7ea419",
      "fecha_asignacion": "2026-10-01",
      "fecha_desasignacion": null,
      "observaciones": "Asignado de manera permanente al bus nuevo."
    }
  ]
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Arreglo con los registros (vacío `[]` si no hay ninguno). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/historial-conductores"
method: GET
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 2000
