$kind: http-request
description: |-
  Crea un nuevo tipo de vehículo. Gestiona el catálogo de tipos de vehículo (Automóvil, Van, Bus…).

  ## Endpoint

  `POST {{baseUrl}}/tipos-vehiculo`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**.

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Request Body

  | Campo | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `nombre_tipo` | string | Sí | Nombre del tipo (mínimo 2 caracteres). **Único**. |
  | `descripcion` | string | No | Descripción del tipo de vehículo. |

  Los campos que no estén en esta tabla se ignoran.

  ## Ejemplo de Request Body

  ```json
  {
    "nombre_tipo": "Autobús de dos pisos",
    "descripcion": "Vehículo de larga distancia con capacidad superior a 60 pasajeros"
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `201 Created` | El tipo de vehículo se creó. Devuelve `{ success, message, data }` con el registro guardado. |
  | `400 Bad Request` | Faltan campos obligatorios o algún dato no cumple el formato. El campo `detalles` indica qué campo falló y por qué. |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `409 Conflict` | Ya existe un registro con ese nombre_tipo. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/tipos-vehiculo"
method: POST
body:
  type: json
  content: |-
    {
      "nombre_tipo": "Autobús de dos pisos",
      "descripcion": "Vehículo de larga distancia con capacidad superior a 60 pasajeros"
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
examples: ./.resources/Añadir.resources/examples
order: 1000
