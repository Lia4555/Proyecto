$kind: http-request
description: |-
  Actualiza el cliente indicado por su `id_cliente`. Es una **actualización parcial**: solo se envían los campos que se quieren cambiar.

  ## Endpoint

  `PUT {{baseUrl}}/clientes/:id`

  Ejemplo: `PUT {{baseUrl}}/clientes/e0b89bcb-adba-4ed0-b600-860c7bdcfd55`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**. Además, en cada petición se comprueba que la cuenta siga activa: si un administrador la desactiva, el token deja de servir al momento (`401`).

  Solo un usuario con rol **Administrador** puede usar este endpoint.

  ## Parámetros de ruta

  | Parámetro | Tipo | Requerido | Descripción |
  | --- | --- | --- | --- |
  | `id` | string (UUID) | Sí | `id_cliente` del registro a actualizar. |

  ## Request Body

  Cualquiera de estos campos (todos opcionales), con las mismas reglas que al crear. La clave `id_cliente` y los campos desconocidos se ignoran:

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `nombre` | string | Solo letras y espacios, de 2 a 60 caracteres. |
  | `apellido` | string | Solo letras y espacios, de 2 a 60 caracteres. |
  | `tipo_documento` | string | Tipo de documento: `CC`, `CE`, `TI`, `NIT` (solo números) o `PA` (pasaporte, letras y números). |
  | `numero_documento` | string | De 5 a 15 dígitos (pasaporte: 5 a 20 letras o números). Puntos y espacios se eliminan solos. **Único**. |
  | `email` | string (email) | Correo electrónico. **Único**. |
  | `telefono` | string | Entre 7 y 15 dígitos; admite espacios y un `+` inicial. |
  | `fecha_nacimiento` | string (date) | Formato `YYYY-MM-DD`. |
  | `direccion` | string | Dirección de residencia. |

  ## Datos delicados

  Por protección de datos personales, la API **nunca devuelve completos** estos campos, tampoco al administrador:

  - **No se devuelven:** `fecha_nacimiento`, `direccion`.
  - **Llegan enmascarados** (solo los últimos 4 caracteres, ej. `••••5678`): `numero_documento`.

  Al editar se pueden enviar con el valor completo para cambiarlos. Si se reenvía el valor enmascarado (`••••5678`, como hace el formulario cuando no se toca), **se ignora** y el dato real se conserva. Si un campo oculto no se envía, también se conserva.

  ## Ejemplo de Request Body

  ```json
  {
    "telefono": "3192223344",
    "direccion": "Av. Cra 68 #123-90"
  }
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Registro actualizado. Devuelve `{ success, data }` con el registro completo. |
  | `400 Bad Request` | No se envió ningún campo válido, o algún dato no cumple el formato (ver `detalles`). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `404 Not Found` | No existe un cliente con ese `id`. |
  | `409 Conflict` | Ya existe otro registro con ese numero_documento o email. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/clientes/e0b89bcb-adba-4ed0-b600-860c7bdcfd55"
method: PUT
body:
  type: json
  content: |-
    {
      "telefono": "3192223344",
      "direccion": "Av. Cra 68 #123-90"
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 3000
