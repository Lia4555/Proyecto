$kind: http-request
description: |-
  Lista los clientes (pasajeros) que hacen reservas. Devuelve un arreglo JSON con todos los registros.

  ## Endpoint

  `GET {{baseUrl}}/clientes`

  ## Autenticación

  Requiere el header `Authorization: Bearer {{auth_token}}`. El token se obtiene con **USUARIO › Crear LogIn Token** (o **Admin login**), que lo guarda solo en la variable `auth_token` del environment **TransporteAPI**. Además, en cada petición se comprueba que la cuenta siga activa: si un administrador la desactiva, el token deja de servir al momento (`401`).

  ## Permisos

  - **Administrador:** ve todos los registros.
  - **Conductor:** no tiene acceso a esta tabla (`403`).

  ## Campos de la respuesta

  | Campo | Tipo | Descripción |
  | --- | --- | --- |
  | `id_cliente` | string (UUID) | Identificador único (lo asigna la base de datos). |
  | `nombre` | string | Solo letras y espacios, de 2 a 60 caracteres. |
  | `apellido` | string | Solo letras y espacios, de 2 a 60 caracteres. |
  | `tipo_documento` | string | Tipo de documento: `CC`, `CE`, `TI`, `NIT` (solo números) o `PA` (pasaporte, letras y números). |
  | `numero_documento` | string | De 5 a 15 dígitos (pasaporte: 5 a 20 letras o números). Puntos y espacios se eliminan solos. **Único**. **Llega enmascarado** (`••••5678`). |
  | `email` | string (email) | Correo electrónico. **Único**. |
  | `telefono` | string | Entre 7 y 15 dígitos; admite espacios y un `+` inicial. |

  ## Datos delicados

  Por protección de datos personales, la API **nunca devuelve completos** estos campos, tampoco al administrador:

  - **No se devuelven:** `fecha_nacimiento`, `direccion`.
  - **Llegan enmascarados** (solo los últimos 4 caracteres, ej. `••••5678`): `numero_documento`.

  ## Ejemplo de respuesta

  ```json
  [
    {
      "id_cliente": "f38b2ffc-80a4-4f5a-91c9-bc701e7ea419",
      "nombre": "Anamaría",
      "apellido": "Restrepo",
      "tipo_documento": "CE",
      "numero_documento": "••••3456",
      "email": "anamaria@email.com",
      "telefono": "3159998877"
    }
  ]
  ```

  ## Respuestas

  | Código | Descripción |
  | --- | --- |
  | `200 OK` | Arreglo con los registros (vacío `[]` si no hay ninguno). |
  | `401 Unauthorized` | No se envió el token, o el token expiró (dura 8 horas). Vuelve a ejecutar el login. |
  | `403 Forbidden` | El rol de la sesión no tiene permiso para esta operación. |
  | `500 Internal Server Error` | Error interno del servidor. |
url: "{{baseUrl}}/clientes"
method: GET
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{auth_token}}"
order: 2000
